[project]
name = "pdf-rag-demo"
version = "0.1.0"
description = "Demo chatbot hoi dap dua tren tai lieu noi bo"
requires-python = ">=3.11"
dependencies = [
  "streamlit>=1.41,<2",
  "openai>=2.0,<3",
  "httpx>=0.28,<1",
  "PyJWT[crypto]>=2.9,<3",
  "pypdf>=5.1,<7",
  "python-docx>=1.1,<2",
  "python-pptx>=1.0,<2",
  "openpyxl>=3.1,<4",
  "python-dotenv>=1.0,<2",
]

[dependency-groups]
dev = ["pytest>=8.3,<10"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
